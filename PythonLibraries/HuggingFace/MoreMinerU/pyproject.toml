[tool.poetry]
name = "moremineru"
version = "0.1.0"
description = "Wrappers around mineru-vl-utils for vLLM-served document extraction"
authors = ["Ernest Yeung <ernestyalumni@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/InServiceOfX/InServiceOfX"

[tool.poetry.urls]
"Source Code" = "https://github.com/InServiceOfX/InServiceOfX/tree/master/PythonLibraries/HuggingFace/MoreMinerU"

# Runtime deps (vllm, mineru-vl-utils, pydantic, pillow, pdf2image) are provided
# by the VLLMMultimodal Docker image. This project file only declares the language
# version and test deps so the package can be `pip install -e .`'d in-container.
[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^8.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
